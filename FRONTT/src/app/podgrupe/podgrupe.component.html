<div class="header-container">
  <h1 class="sticky-title">{{ naziv }}</h1>

  <div class="description">
    {{ opis }}
  </div>
</div>

<div class="container mt-4">
  <div class="row row-cols-1 row-cols-md-3 row-cols-lg-5 g-3">
    <div
      *ngFor="let p of podgrupe; let i = index"
      class="col d-flex justify-content-center fade-in"
      [style.animationDelay]="(i * 200) + 'ms'"
    >
      <app-podgrupa-card [podgrupa]="p" [grupa]="naziv"></app-podgrupa-card>
    </div>
  </div>
</div>
