<div class="carousel-container" [ngClass]="{ 'hidden-on-scroll': isCarouselHidden }">
  <div class="carousel-slide" *ngFor="let slide of slides; let i = index" [class.active]="i === currentSlide">
    <img [src]="slide.imageUrl" [alt]="slide.altText">
    <div class="carousel-caption">
      <h2>{{ slide.title }}</h2>
      <p>{{ slide.subtitle }}</p>
    </div>
  </div>

  <button class="carousel-control prev" (click)="prevSlide()">‹</button>
  <button class="carousel-control next" (click)="nextSlide()">›</button>

  <div class="carousel-indicators">
    <span *ngFor="let slide of slides; let i = index"
          [class.active]="i === currentSlide"
          (click)="goToSlide(i)"></span>
  </div>
</div>
