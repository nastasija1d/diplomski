<div style="padding: 0px;margin: 0px;">
  <app-carousel></app-carousel>

  <app-najprodavaniji></app-najprodavaniji>
  <app-grupe-stranica></app-grupe-stranica>

  <div class="brand-wrapper">
    <div class="brand-header">
      <h2>Vrhunski brendovi, bez kompromisa</h2>
      <p>
        Naša prodavnica ponosno nudi originalne auto delove za vodeće svetske brendove.
        Bilo da vozite nemački klasik, italijanski gradski auto ili američku ikonu – kod nas ćete pronaći sve što vam je potrebno.
      </p>
    </div>
    <div class="brand-section">
      <div class="brand-card" *ngFor="let brand of brands; let i = index" #cardRef [style.--delay]="i * 0.2 + 's'" >
        <div class="brand-image-wrapper">
          <img [src]="brand.logo" alt="{{ brand.name }} logo" class="brand-image" />
        </div>
        <div class="brand-content">
          <h3>{{ brand.name }}</h3>
          <p>{{ brand.description }}</p>
        </div>
      </div>
    </div>
  </div>

  <app-kontakt></app-kontakt>
