<div class="sidebar" *ngIf="isOpen">
  <div class="sidebar-content">
    <!-- Zatvori dugme -->
    <button class="close-btn" (click)="closeSidebar()">×</button>

    <!-- Osnovne stavke -->
    <div class="sidebar-item" (click)="goToPage('/')">Početna</div>
    <div class="sidebar-item" (click)="goToPage('/korpa')">Korpa</div>
    <div class="sidebar-item" (click)="goToPage('/profil')">Uloguj se / Odjavi se</div>

    <!-- PROIZVODI toggle -->
    <div
      class="sidebar-item proizvodi-toggle"
      [class.active]="showProizvodi"
      (click)="toggleProizvodi()"
    >
      <span>PROIZVODI</span>
      <span class="arrow" [ngClass]="{ 'arrow-down': showProizvodi, 'arrow-right': !showProizvodi }">
        ▼
      </span>
    </div>

    <!-- Grupe -->
    <div *ngIf="showProizvodi" class="product-groups-section animate">
      <div
        *ngFor="let group of productGroups"
        class="sidebar-group"
        [class.active]="selectedGroup === group"
      >
        <div class="group-header">
          <span class="group-name" (click)="goToGroup(group)">{{ group }}</span>
          <button class="toggle-button" (click)="toggleSubgroups(group); $event.stopPropagation()">
            <span [ngClass]="{ 'arrow-down': selectedGroup === group, 'arrow-right': selectedGroup !== group }">
              ▼
            </span>
          </button>
        </div>

        <!-- Podgrupe sa slikama -->
        <div *ngIf="selectedGroup === group" class="subgroup-list animate">
          <div
            *ngFor="let p of subgroups[group]"
            class="sidebar-subitem-with-image"
            (click)="goToSubGroup(group, p)"
          >
            <div class="subitem-image-wrapper">
              <img
                [src]="'http://localhost:8080/slika/podgrupa/' + formatPodVrsta(p)"
                [alt]="p"
              />
            </div>
            <div class="subitem-text">{{ p }}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
