<div class="search-wrapper">
  <div class="search-box">
    <input type="text" [(ngModel)]="query" placeholder="Pretraga..." (keydown.enter)="search()" />
    <button class="search-btn" (click)="search()" aria-label="Pretraga">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="20"
    height="20"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    viewBox="0 0 24 24"
  >
    <circle cx="11" cy="11" r="7" />
    <line x1="21" y1="21" x2="16.65" y2="16.65" />
  </svg>
</button>

  </div>

  <div class="search-overlay" *ngIf="showResults">
    <div class="results-box">
      <app-search-card *ngFor="let item of results" [item]="item"></app-search-card>
    </div>
  </div>
</div>
