<div class="dashboard-container">
    <!-- Left side: pie chart + controls -->
    <div class="pie-wrapper">
      <div class="pie-controls">
        <button class="pie-btn">Marka</button>
        <button class="pie-btn">Proizvođač</button>
        <button class="pie-btn">Kategorija</button>
      </div>
      <div class="pie-chart">
        <app-pie-chart [data]="[['Marka A', 10], ['Marka B', 20], ['Marka C', 5], ['Marka D', 15], ['Marka E', 25], ['Marka F', 20]]"></app-pie-chart>
      </div>
    </div>
  
    <!-- Right side: calendar -->
    <div class="calendar-wrapper">
      <app-calendar></app-calendar>
    </div>
  </div>
